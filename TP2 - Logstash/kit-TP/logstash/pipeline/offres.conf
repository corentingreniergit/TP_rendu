input {
  file {
    path => "/data/offres.ndjson"
    mode => "read"
    codec => "json"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/offres_lus.log"
  }
}

filter {
  mutate {
    remove_field => ["@timestamp", "@version", "event", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    index => "offres"
    document_id => "%{id}"
    action => "index"
    data_stream => "false"
    manage_template => false
  }
}
