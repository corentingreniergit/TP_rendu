input {
  file {
    path => "/data/access.log"
    mode => "read"
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/web_lus.log"
  }
}

filter {
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }
  date {
    match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    locale => "en"
    remove_field => ["timestamp"]
  }
  useragent {
    source => "[user_agent][original]"
  }
  if [url][original] =~ /^\/offres\/OFF-/ {
    grok {
      pattern_definitions => { "OFFRE_ID" => "OFF-[0-9]{5}" }
      match => { "[url][original]" => "^/offres/%{OFFRE_ID:[labels][offre_id]}" }
    }
  }
  if "_grokparsefailure" not in [tags] {
    mutate { remove_field => ["[event][original]"] }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "web"
    data_stream_namespace => "default"
  }
}
